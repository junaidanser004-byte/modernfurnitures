<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Modern Furnitures</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>








<!-- REGISTER SECTION -->
<section class="auth-section">
  <div class="auth-bg-slide active" style="background-image:url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1600&auto=format&fit=crop')"></div>
  <div class="auth-bg-slide" style="background-image:url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1600&auto=format&fit=crop')"></div>
  <div class="auth-bg-slide" style="background-image:url('https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=1600&auto=format&fit=crop')"></div>
  <div class="auth-bg-overlay"></div>
<div class="auth-card">
   <div style="text-align:center; margin-bottom:20px;">
     <h1 style="font-size:18px; font-weight:700; color:#1f2937; margin-bottom:2px;">Modern Furnitures</h1>
     <h2 style="font-size:22px; font-weight:700; color:#1f2937; margin-top:12px;">Register</h2>
   </div>
   <input type="email" id="regEmail" placeholder="Email"
    onkeydown="if(event.key==='Enter') document.getElementById('regOtp').focus()"
    style="width:100%; padding:11px 14px; margin-bottom:12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; outline:none;">
   <input type="text" id="regOtp" placeholder="Enter OTP"
    onkeydown="if(event.key==='Enter') document.getElementById('regPassword').focus()"
    style="width:100%; padding:11px 14px; margin-bottom:12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; outline:none;">
   <div style="position:relative; margin-bottom:12px;">
     <input type="password" id="regPassword" placeholder="Password"
      onkeydown="if(event.key==='Enter') registerUser()"
      style="width:100%; padding:11px 42px 11px 14px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box;">
     <span onclick="toggleRegPassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280; display:flex; align-items:center; user-select:none; z-index:2;">
      <svg id="regEyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      <svg id="regEyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
     </span>
   </div>
   <button onclick="sendOtp()"
    style="width:100%; padding:12px; background:#6b7280; color:white; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;">
    Send OTP
  </button>
   <button onclick="registerUser()"
    style="width:100%; padding:12px; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;">
    Register
  </button>




  <p style="text-align:center; font-size:14px; color:#6b7280;">
    Already have an account?
    <a href="login.html" style="color:#3b82f6; font-weight:600;">Login</a>
  </p>




  <p id="registerMsg" style="text-align:center; margin-top:10px; font-size:14px;"></p>
</div>
</section>
<script>
(function() {
  let idx = 0;
  const slides = document.querySelectorAll('.auth-bg-slide');
  setInterval(() => {
    slides[idx].classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active');
  }, 4000);
})();
</script>




<script src="script.js?v=3"></script>
<script>
function toggleRegPassword() {
  const input  = document.getElementById('regPassword');
  const open   = document.getElementById('regEyeOpen');
  const closed = document.getElementById('regEyeClosed');
  if (input.type === 'password') {
    input.type = 'text';
    open.style.display   = 'none';
    closed.style.display = 'block';
  } else {
    input.type = 'password';
    open.style.display   = 'block';
    closed.style.display = 'none';
  }
}
</script>
</body>
</html>
