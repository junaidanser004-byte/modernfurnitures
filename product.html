<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail - Modern Furnitures</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
 .product-detail-wrap {
   max-width: 1100px;
   margin: 30px auto;
   padding: 0 30px 60px;
 }
 .breadcrumb {
   font-size: 13px;
   color: #6b7280;
   margin-bottom: 24px;
 }
 .breadcrumb a {
   color: #3b82f6;
   text-decoration: none;
 }
 .breadcrumb a:hover { text-decoration: underline; }
 .breadcrumb span { margin: 0 6px; }


 .product-layout {
   display: grid;
   grid-template-columns: 1fr 1fr;
   gap: 50px;
   align-items: start;
 }


 /* LEFT - Image */
 .product-img-wrap img {
   width: 100%;
   border-radius: 14px;
   object-fit: cover;
   max-height: 480px;
   box-shadow: 0 4px 20px rgba(0,0,0,0.10);
 }


 /* RIGHT - Info */
 .product-info h1 {
   font-size: 28px;
   font-weight: 800;
   color: #1f2937;
   margin-bottom: 8px;
 }
 .product-price {
   font-size: 22px;
   font-weight: 700;
   color: #3b82f6;
   margin-bottom: 14px;
 }
 .product-desc {
   font-size: 14px;
   color: #6b7280;
   line-height: 1.8;
   margin-bottom: 24px;
 }
 .product-specs {
   width: 100%;
   border-collapse: collapse;
   margin-bottom: 28px;
 }
 .product-specs tr {
   border-bottom: 1px solid #f3f4f6;
 }
 .product-specs td {
   padding: 11px 4px;
   font-size: 14px;
 }
 .product-specs td:first-child {
   color: #6b7280;
   font-weight: 500;
 }
 .product-specs td:last-child {
   text-align: right;
   font-weight: 600;
   color: #1f2937;
 }


 .btn-add-cart {
   width: 100%;
   padding: 16px;
   background: #3b82f6;
   color: white;
   border: none;
   border-radius: 10px;
   font-size: 16px;
   font-weight: 700;
   cursor: pointer;
   transition: background 0.2s;
 }
 .btn-add-cart:hover { background: #2563eb; }


 .cart-success-msg {
   color: #10b981;
   font-weight: 600;
   font-size: 14px;
   margin-top: 10px;
   text-align: center;
 }


 .prev-next-nav {
   display: flex;
   justify-content: space-between;
   margin-bottom: 24px;
   font-size: 13px;
 }
 .prev-next-nav a {
   color: #3b82f6;
   text-decoration: none;
   font-weight: 600;
 }
 .prev-next-nav a:hover { text-decoration: underline; }


 @media(max-width: 768px) {
   .product-layout {
     grid-template-columns: 1fr;
     gap: 24px;
   }
   .product-detail-wrap { padding: 0 16px 60px; }
 }
</style>
</head>
<body>


<!-- NAVBAR -->
<header class="navbar">
 <button class="hamburger" onclick="toggleMobileMenu()">&#9776;</button>
 <h1 class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">Modern Furnitures</h1>
 <div class="search-box">
   <input type="text" placeholder="Search products...">
 </div>
 <nav>
   <a href="index.html">Home</a>
   <a href="products.html">Products</a>
   <a href="about.html">About</a>
   <a href="categories.html">Categories</a>
   <a href="contact.html">Contact</a>
   <a href="#" onclick="openCartPanel()">Cart (<span id="cartCount">0</span>)</a>
 </nav>
</header>


<!-- PRODUCT DETAIL -->
<div class="product-detail-wrap">


 <!-- Breadcrumb -->
 <div class="breadcrumb">
   <a href="index.html">Home</a>
   <span>/</span>
   <a href="products.html">Products</a>
   <span>/</span>
   <span id="breadcrumbName">Product</span>
 </div>


 <!-- Prev / Next -->
 <div class="prev-next-nav">
   <a href="#" onclick="navigateProduct(-1)">&#8592; PREVIOUS</a>
   <a href="#" onclick="navigateProduct(1)">NEXT &#8594;</a>
 </div>


 <!-- Layout -->
 <div class="product-layout">
   <!-- Left: Image -->
   <div class="product-img-wrap">
     <img id="detailImg" src="" alt="">
   </div>


   <!-- Right: Info -->
   <div class="product-info">
     <h1 id="detailName"></h1>
     <div class="product-price" id="detailPrice"></div>
     <p class="product-desc" id="detailDesc"></p>
     <table class="product-specs" id="detailSpecs"></table>
     <button class="btn-add-cart" onclick="addToCartDetail()">&#128722; Add to Cart</button>
     <p class="cart-success-msg" id="cartMsg"></p>
   </div>
 </div>


</div>


<!-- CART PANEL -->
<div id="cartPanel" class="cart-panel">
 <div class="cart-panel-header">
   <span>SHOPPING CART <span id="cartBadge" class="cart-badge">0</span></span>
   <button onclick="closeCartPanel()">&#10005;</button>
 </div>
 <hr>
 <div id="cartPanelItems" class="cart-panel-items"></div>
 <div class="cart-panel-footer">
   <hr>
   <div class="cart-subtotal">
     <span>SUBTOTAL:</span>
     <span id="cartPanelTotal">QAR 0</span>
   </div>
   <div class="cart-view-link" onclick="window.location.href='cart.html'">VIEW CART</div>
   <button class="cart-checkout-btn" onclick="goCheckoutAll()">CHECKOUT</button>
 </div>
</div>
<div id="cartOverlay" class="cart-overlay" onclick="closeCartPanel()"></div>

const productKeys = Object.keys(allProductsData);
let currentProductName = '';


window.addEventListener('DOMContentLoaded', function() {
 loadCart();
 const params = new URLSearchParams(window.location.search);
 const name = params.get('product') || params.get('name');
 if (name && allProductsData[name]) {
 currentProductName = name;
 renderProduct(name);
} else {
 document.querySelector('.product-detail-wrap').innerHTML = '...Product not found...';
}
});


function renderProduct(name) {
 const p = allProductsData[name];
 document.title = name + ' - Modern Furnitures';
 document.getElementById('breadcrumbName').innerText = name;
 document.getElementById('detailImg').src = p.img;
 document.getElementById('detailImg').alt = name;
 document.getElementById('detailName').innerText = name;
 document.getElementById('detailPrice').innerText = 'QAR ' + p.price.toLocaleString();
 document.getElementById('detailDesc').innerText = p.description;
 document.getElementById('cartMsg').innerText = '';


 let specsHtml = '';
 for (let [key, val] of Object.entries(p.specs)) {
   specsHtml += `<tr><td>${key}</td><td>${val}</td></tr>`;
 }
 document.getElementById('detailSpecs').innerHTML = specsHtml;
}


function addToCartDetail() {
 const p = allProductsData[currentProductName];
 if (!p) return;
 addtocart(currentProductName, p.price);
 const msg = document.getElementById('cartMsg');
 msg.innerText = currentProductName + ' added to cart ✔';
 setTimeout(() => { msg.innerText = ''; }, 3000);
}


function navigateProduct(direction) {
 const idx = productKeys.indexOf(currentProductName);
 let newIdx = idx + direction;
 if (newIdx < 0) newIdx = productKeys.length - 1;
 if (newIdx >= productKeys.length) newIdx = 0;
 currentProductName = productKeys[newIdx];
 window.history.pushState({}, '', 'product.html?product=' + encodeURIComponent(currentProductName));
 renderProduct(currentProductName);
}
</script>
