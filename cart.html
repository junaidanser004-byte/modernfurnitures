<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cart - Modern Furnitures</title>
 <link rel="stylesheet" href="style.css?v=3">
 <style>
   .cart-page-wrap { max-width: 1100px; margin: 40px auto; padding: 0 30px; }
   .cart-page-title { font-size: 28px; font-weight: 800; color: #1f2937; margin-bottom: 30px; }
   .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 40px; }
   .cart-table-head {
     display: flex; justify-content: space-between;
     padding: 0 0 12px; border-bottom: 1px solid #e5e7eb;
     font-size: 11px; font-weight: 700; color: #9ca3af;
     letter-spacing: 1.5px; text-transform: uppercase;
   }
   .cart-item-row {
     display: flex; align-items: center;
     padding: 18px 0; border-bottom: 1px solid #f3f4f6; gap: 16px;
   }
   .cart-item-row img {
     width: 80px; height: 70px; object-fit: cover;
     border-radius: 8px; background: #f3f4f6;
   }
   .cart-item-info { flex: 1; }
   .cart-item-name { font-size: 14px; font-weight: 600; color: #111; }
   .cart-item-price { font-size: 13px; color: #6b7280; margin-top: 2px; }
   .cart-item-qty {
     display: flex; align-items: center;
     border: 1px solid #d1d5db; border-radius: 20px;
     width: fit-content; overflow: hidden; margin-top: 8px;
   }
   .cart-item-qty button {
     background: none; border: none; width: 32px;
     height: 32px; font-size: 16px; cursor: pointer; color: #374151;
   }
   .cart-item-qty span {
     width: 34px; text-align: center; font-size: 14px;
     font-weight: 600; border-left: 1px solid #e5e7eb;
     border-right: 1px solid #e5e7eb; line-height: 32px;
   }
   .cart-item-total { font-size: 14px; font-weight: 700; color: #111; min-width: 80px; text-align: right; }
   .cart-item-remove {
     background: #fee2e2; border: none; color: #ef4444;
     width: 30px; height: 30px; border-radius: 50%;
     font-size: 14px; cursor: pointer; display: flex;
     align-items: center; justify-content: center;
   }
   .totals-box {
     background: white; border-radius: 12px; padding: 24px;
     box-shadow: 0 2px 12px rgba(0,0,0,0.07);
     position: sticky; top: 80px; height: fit-content;
   }
   .totals-box h3 {
     font-size: 13px; font-weight: 700; color: #9ca3af;
     letter-spacing: 1.5px; margin-bottom: 16px; text-transform: uppercase;
   }
   .coupon-row {
     display: flex; justify-content: space-between; align-items: center;
     padding: 12px 0; border-top: 1px solid #f3f4f6;
     border-bottom: 1px solid #f3f4f6;
     font-size: 14px; color: #374151; cursor: pointer;
   }
   .coupon-inputs { display: none; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
   .coupon-inputs.show { display: flex; }
   .coupon-inputs input {
     flex: 1; padding: 8px 12px; border: 1px solid #d1d5db;
     border-radius: 6px; font-size: 13px; outline: none;
   }
   .coupon-inputs button {
     padding: 8px 14px; background: #3b82f6; color: white;
     border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
   }
   .total-row {
     display: flex; justify-content: space-between;
     font-size: 14px; color: #6b7280;
     padding: 10px 0; border-bottom: 1px solid #f9fafb;
   }
   .total-row.final {
     font-size: 16px; font-weight: 700; color: #0ea5e9;
     border-bottom: none; padding-top: 14px;
   }
   .checkout-btn {
     width: 100%; padding: 14px; background: #3b82f6;
     color: white; border: none; border-radius: 8px;
     font-size: 15px; font-weight: 700; cursor: pointer;
     margin-top: 16px; transition: background 0.2s;
   }
   .checkout-btn:hover { background: #2563eb; }
   .empty-cart { text-align: center; padding: 60px 0; color: #9ca3af; font-size: 16px; }
   @media(max-width:768px) { .cart-layout { grid-template-columns: 1fr; } .totals-box { position: static; } }
 </style>
</head>
<body>


<!-- NAVBAR -->
<header class="navbar">
 <button class="hamburger" onclick="toggleMobileMenu()">&#9776;</button>
 <h1 class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">Modern Furnitures</h1>
 <div class="search-box">
   <input type="text" placeholder="Search products...">
 </div>
 <nav>
   <a href="index.html">Home</a>
   <a href="products.html">Products</a>
   <a href="about.html">About</a>
   <a href="categories.html">Categories</a>
   <a href="contact.html">Contact</a>
   <a href="#" onclick="openCartPanel()">Cart (<span id="cartCount">0</span>)</a>
 </nav>
</header>


<!-- CART FULL PAGE -->
<div class="cart-page-wrap">
 <h2 class="cart-page-title">Shopping Cart</h2>
 <div id="cartFullContent"></div>
</div>


<!-- CART PANEL -->
<div id="cartPanel" class="cart-panel">
 <div class="cart-panel-header">
   <span>SHOPPING CART <span id="cartBadge" class="cart-badge">0</span></span>
   <button onclick="closeCartPanel()">&#10005;</button>
 </div>
 <hr>
 <div id="cartPanelItems" class="cart-panel-items"></div>
 <div class="cart-panel-footer">
   <hr>
   <div class="cart-subtotal">
     <span>SUBTOTAL:</span>
     <span id="cartPanelTotal">QAR 0</span>
   </div>
   <div class="cart-view-link" onclick="window.location.href='cart.html'">VIEW CART</div>
   <button class="cart-checkout-btn" onclick="goCheckoutAll()">CHECKOUT</button>
 </div>
</div>
<div id="cartOverlay" class="cart-overlay" onclick="closeCartPanel()"></div>


<!-- MOBILE BOTTOM NAV -->
<div class="bottom-nav">
 <a href="#" onclick="toggleBottomSearch()">
   <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
   </svg>
   Search
 </a>
 <a href="#" onclick="openCartPanel()">
   <div class="bn-cart-wrap">
     <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
     </svg>
     <span class="bn-badge" id="bnCartBadge">0</span>
   </div>
   Cart
 </a>
 <a href="categories.html">
   <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
   </svg>
   Categories
 </a>
</div>


<script src="script.js?v=3"></script>
<script>
const productImgs = {
 'Sofa': 'https://m.media-amazon.com/images/I/812EhSvR2dL.jpg',
 'Chair': 'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=200&auto=format&fit=crop',
 'Table': 'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=200&auto=format&fit=crop',
 'Bed': 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=200&auto=format&fit=crop',
 'L-Shape Sofa': 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200&auto=format&fit=crop',
 'Wardrobe': 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=200&auto=format&fit=crop',
 'Bookshelf': 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=200&auto=format&fit=crop',
 'Dining Table': 'https://images.unsplash.com/photo-1532372576444-dda954194ad0?w=200&auto=format&fit=crop',
 'Office Chair': 'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=200&auto=format&fit=crop',
 'Coffee Table': 'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=200&auto=format&fit=crop',
 'TV Stand': 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=200&auto=format&fit=crop',
 'Dresser': 'https://images.unsplash.com/photo-1551298370-9d3d53740c72?w=200&auto=format&fit=crop'
};


window.addEventListener('DOMContentLoaded', function() {
 loadCart();
 renderFullCart();
});


function renderFullCart() {
 const box = document.getElementById('cartFullContent');
 const savedCart = JSON.parse(localStorage.getItem('cartData') || '[]');


 if (savedCart.length === 0) {
   box.innerHTML = '<div class="empty-cart">🛒 Your cart is empty.<br><br><a href="products.html" style="color:#3b82f6; font-weight:600;">Continue Shopping</a></div>';
   return;
 }


 let rows = '';
 let subtotal = 0;


 savedCart.forEach((item, index) => {
   const itemTotal = item.price * item.qty;
   subtotal += itemTotal;
   rows += `
     <div class="cart-item-row">
       <img src="${productImgs[item.name] || ''}" alt="${item.name}">
       <div class="cart-item-info">
         <div class="cart-item-name">${item.name}</div>
         <div class="cart-item-price">QAR ${item.price.toLocaleString()}</div>
         <div class="cart-item-qty">
           <button onclick="changeQty(${index},-1)">−</button>
           <span>${item.qty}</span>
           <button onclick="changeQty(${index},1)">+</button>
         </div>
       </div>
       <div class="cart-item-total">QAR ${itemTotal.toLocaleString()}</div>
       <button class="cart-item-remove" onclick="removeItem(${index})">✕</button>
     </div>`;
 });


 const estimated = subtotal + 100;


 box.innerHTML = `
   <div class="cart-layout">
     <div>
       <div class="cart-table-head"><span>PRODUCT</span><span>TOTAL</span></div>
       ${rows}
     </div>
     <div class="totals-box">
       <h3>CART TOTALS</h3>
       <div class="coupon-row" onclick="this.nextElementSibling.classList.toggle('show')">
         <span>Add coupons</span><span>⌄</span>
       </div>
       <div class="coupon-inputs">
         <input type="text" placeholder="Coupon code">
         <button>Apply</button>
       </div>
       <div class="total-row"><span>Subtotal</span><span>QAR ${subtotal.toLocaleString()}</span></div>
       <div class="total-row"><span>Flat rate</span><span>QAR 100</span></div>
       <div class="total-row final"><span>Estimated total</span><span>QAR ${estimated.toLocaleString()}</span></div>
       <button class="checkout-btn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
     </div>
   </div>`;
}


function changeQty(index, delta) {
 let savedCart = JSON.parse(localStorage.getItem('cartData') || '[]');
 savedCart[index].qty += delta;
 if (savedCart[index].qty <= 0) savedCart.splice(index, 1);
 localStorage.setItem('cartData', JSON.stringify(savedCart));
 location.reload();
}


function removeItem(index) {
 let savedCart = JSON.parse(localStorage.getItem('cartData') || '[]');
 savedCart.splice(index, 1);
 localStorage.setItem('cartData', JSON.stringify(savedCart));
 location.reload();
}
</script>


</body>
</html>
